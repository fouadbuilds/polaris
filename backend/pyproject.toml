[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-api"
version = "0.1.0"
description = "API foundation for the Polaris port-siting prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
data = [
  "rasterio>=1.4,<2",
  "shapely>=2,<3",
  "pyshp>=2.3,<3",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
